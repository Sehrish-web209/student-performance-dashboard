name: Auto-Grader (Stage 1 - Test & Quality Check)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting & Syntax
        run: npm run lint

      - name: Run Auto-Grader Tests
        continue-on-error: true
        run: |
          # Runs Vitest/Jest in JSON output mode and saves to test-results.json
          npx vitest run --reporter=json --outputFile=test-results.json || true

      - name: Save PR Number
        run: echo "${{ github.event.number }}" > pr_number.txt

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results.json
            pr_number.txt
          retention-days: 1
