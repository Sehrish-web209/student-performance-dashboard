name: Auto-Grader (Stage 2 - Post PR Report)

on:
  workflow_run:
    workflows: ["Auto-Grader (Stage 1 - Test & Quality Check)"]
    types: [completed]

jobs:
  post-grading-comment:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      issues: write
    steps:
      - name: Download Test Artifact
        uses: actions/download-artifact@v8
        with:
          name: test-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Parse Results & Post PR Comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            // 1. Read PR Number from artifact
            if (!fs.existsSync('pr_number.txt') || !fs.existsSync('test-results.json')) {
              console.log('Artifact files missing. Skipping comment.');
              return;
            }

            const issueNumber = parseInt(fs.readFileSync('pr_number.txt', 'utf8').trim(), 10);
            const rawData = fs.readFileSync('test-results.json', 'utf8');
            
            let testData;
            try {
              testData = JSON.parse(rawData);
            } catch (e) {
              console.error('Failed to parse test results JSON');
              return;
            }

            // 2. Extract Test Metrics
            const numTotalTests = testData.numTotalTests || 0;
            const numPassedTests = testData.numPassedTests || 0;
            const numFailedTests = testData.numFailedTests || 0;
            const scorePercentage = numTotalTests > 0 ? Math.round((numPassedTests / numTotalTests) * 100) : 0;

            const statusBadge = scorePercentage === 100 ? '🟢 **ALL PASSED**' : '🔴 **ACTION REQUIRED**';

            // Build detailed test case breakdown table
            let testRows = '';
            if (testData.testResults) {
              for (const suite of testData.testResults) {
                for (const test of suite.assertionResults) {
                  const icon = test.status === 'passed' ? '✅' : '❌';
                  testRows += `| ${icon} | \`${test.title}\` | **${test.status.toUpperCase()}** |\n`;
                }
              }
            }

            // 3. Format Comment Markdown
            const commentBody = `## 📊 Auto-Grader Results: ${scorePercentage}% Score

            ${statusBadge}

            | Status | Test Case | Outcome |
            | :---: | :--- | :--- |
            ${testRows}

            ---
            * **Total Tests:** ${numTotalTests}
            * **Passed:** ${numPassedTests}
            * **Failed:** ${numFailedTests}

            > *This comment is automatically generated by the Auto-Grader.*`;

            // 4. Update existing comment or create a new one (prevents comment spam)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const botComment = comments.data.find(c => c.body && c.body.includes('📊 Auto-Grader Results:'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });
            }